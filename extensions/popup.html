<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    #site-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
    }
    #status {
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 10px;
      color: #555;
    }
    #status.success { color: #1a7f37; font-weight: 600; }
    #status.error   { color: #c0392b; font-weight: 600; }
    button {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }
    button:disabled { background: #aaa; cursor: default; }
    #file-hint {
      font-size: 11px;
      color: #555;
      margin-top: 12px;
      background: #f5f5f5;
      border-radius: 4px;
      padding: 8px;
      display: none;
    }
    #file-hint code {
      font-family: monospace;
      font-size: 11px;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <h2>Claude Session Capture</h2>
  <div id="site-label">Detecting site…</div>
  <div id="status"></div>
  <button id="capture-btn" disabled>Capture &amp; Copy to Clipboard</button>
  <div id="file-hint"></div>

  <script src="site_config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
